packages:
  - '.'

allowBuilds:
  '@nestjs/core': true
  bcrypt: true
  # Native resolver pulled in by eslint-import-resolver-typescript. Its build
  # script is deliberately not run: lint resolves fine without it, and this is
  # a dev-only dependency, so there's no reason to execute its postinstall.
  # Left unset, pnpm v11 rewrites this file with a placeholder on every
  # install — stating it explicitly is what stops that.
  unrs-resolver: false

# Transitive security overrides — the single source of truth for them.
#
# This file is the only place pnpm reads overrides from: it ignores
# package.json's top-level `overrides`, and since v11 the `pnpm.overrides`
# key too (it warns and carries on). Since CI now runs `pnpm audit` against
# pnpm-lock.yaml, an entry here is both what fixes the shipped tree and what
# makes CI go green — there is no second list to keep in sync.
#
# Pin a direct dependency by bumping its range in package.json instead;
# overrides are for transitive ones you cannot reach directly.
overrides:
  brace-expansion: '>=5.0.9'
  # Dev-only (ajv, via @nestjs/cli and webpack's schema-utils). Capped below 4
  # because ajv declares ^3 — 3.1.5 is the patched release on that line.
  fast-uri: '^3.1.5'
  glob: '>=10.5.0'
  lodash: '>=4.17.24'
  multer: '>=2.2.0'
  picomatch: '>=4.0.4'
  # Reached through @nestjs/platform-socket.io > socket.io, so it can't be
  # pinned by bumping a direct dependency — socket.io ^4.8.3 is already current
  # and still resolves the vulnerable parser.
  socket.io-parser: '>=4.2.7'
  tmp: '>=0.2.6'
